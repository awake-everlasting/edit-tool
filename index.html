<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하늘빛 사진첩 · 콜라주 만들기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
  :root{
    --sky:#cfeafb;
    --sky-mid:#9fd4f3;
    --sky-deep:#5bb5e6;
    --sky-dark:#2f7fb5;
    --ink:#2e4a5e;
    --ink-soft:#6b8599;
    --paper:#ffffff;
    --pale:#f1f9fe;
    --line:#b9def4;
    --dot:#ff9a3c;
    --pixel:"Galmuri11","Galmuri9","Nanum Gothic",monospace;
    --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--body);font-size:13px;line-height:1.55;color:var(--ink);
    min-height:100vh;
    background-color:var(--sky);
    background-image:
      radial-gradient(circle at 10% 16%, rgba(255,255,255,.9) 0 38px, transparent 39px),
      radial-gradient(circle at 14% 14%, rgba(255,255,255,.9) 0 48px, transparent 49px),
      radial-gradient(circle at 18% 17%, rgba(255,255,255,.9) 0 34px, transparent 35px),
      radial-gradient(circle at 86% 82%, rgba(255,255,255,.85) 0 42px, transparent 43px),
      radial-gradient(circle at 90% 79%, rgba(255,255,255,.85) 0 54px, transparent 55px),
      radial-gradient(circle at 94% 83%, rgba(255,255,255,.85) 0 36px, transparent 37px),
      radial-gradient(rgba(255,255,255,.55) 1.5px, transparent 1.6px);
    background-size:auto,auto,auto,auto,auto,auto,18px 18px;
    background-attachment:fixed;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--dot);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- 상단 ---------- */
  .top{
    max-width:980px;margin:22px auto 10px;padding:0 16px;
    display:flex;align-items:baseline;gap:10px;
  }
  .top h1{
    margin:0;font-family:"Jua",var(--body);font-weight:400;font-size:26px;line-height:1.1;
    color:var(--sky-dark);text-shadow:2px 2px 0 var(--paper);
  }
  .top span{font-family:var(--pixel);font-size:11px;color:var(--sky-dark)}

  /* ---------- 프레임 ---------- */
  .wrap{max-width:980px;margin:0 auto 28px;padding:0 16px}
  .frame{
    position:relative;
    margin-right:76px;
    background:var(--sky-deep);
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 6px, transparent 6px 12px);
    border-radius:16px;padding:14px;
    box-shadow:0 3px 0 var(--sky-dark), 0 10px 30px rgba(47,127,181,.25);
  }
  .frame::before{
    content:"";position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.75);
    border-radius:12px;pointer-events:none;
  }
  .page{
    position:relative;background:var(--paper);border-radius:8px;padding:16px;
    box-shadow:inset 0 0 0 1px var(--line);
  }

  /* ---------- 메인 사진 영역 ---------- */
  .stage{
    position:relative;
    height:clamp(300px, 58vh, 580px);
    border:1px solid var(--line);border-radius:6px;
    background-color:var(--pale);
    background-image:
      linear-gradient(45deg, #e4f3fc 25%, transparent 25%, transparent 75%, #e4f3fc 75%),
      linear-gradient(45deg, #e4f3fc 25%, transparent 25%, transparent 75%, #e4f3fc 75%);
    background-size:24px 24px;background-position:0 0,12px 12px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .stage.over{outline:3px dashed var(--sky-deep);outline-offset:-6px}
  .canvas-wrap{position:relative;line-height:0}
  #canvas{
    display:block;width:100%;height:100%;touch-action:none;border-radius:2px;
    box-shadow:0 2px 0 var(--line), 0 6px 18px rgba(47,127,181,.18);
  }
  .cell-x{
    position:absolute;transform:translate(calc(-100% - 6px), 6px);
    width:24px;height:24px;border-radius:50%;padding:0;line-height:1;
    border:1px solid var(--sky-dark);background:rgba(255,255,255,.92);color:var(--sky-dark);
    font-size:12px;font-weight:800;box-shadow:0 1px 0 var(--sky-dark);
  }
  .cell-x:hover{background:var(--sky-dark);color:var(--paper)}

  /* ---------- 설명 ---------- */
  .guide{
    list-style:none;margin:14px 0 0;padding:0;counter-reset:g;
    font-size:14px;font-weight:700;
  }
  .guide li{counter-increment:g;padding:3px 0;display:flex;gap:8px}
  .guide li::before{
    content:counter(g) ".";font-family:var(--pixel);font-weight:400;color:var(--sky-dark);min-width:16px;
  }

  /* ---------- 아코디언 ---------- */
  .acc{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .25s ease;
  }
  .acc.open{grid-template-rows:1fr}
  .acc > .acc-body{overflow:hidden;min-height:0}
  .acc-inner{
    margin-top:14px;padding:14px 16px;
    background:var(--pale);border:1px solid var(--line);border-radius:6px;
    border-top:3px solid var(--sky-deep);
  }
  .acc-title{
    margin:0 0 12px;font-family:var(--pixel);font-weight:400;font-size:13px;color:var(--sky-dark);
    display:flex;align-items:center;gap:8px;
  }
  .acc-title::after{content:"";flex:1;border-top:1px dotted var(--sky-mid)}
  .grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px 22px}
  .field > label, .field-label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}
  .field-label .val, label .val{font-family:var(--pixel);font-weight:400;color:var(--dot);margin-left:4px}

  .seg{display:flex;border:1px solid var(--sky-deep);border-radius:4px;overflow:hidden;background:var(--paper)}
  .seg label{flex:1;position:relative}
  .seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
  .seg span{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:7px 4px;font-size:12px;font-weight:700;color:var(--sky-dark);
  }
  .seg label + label span{border-left:1px solid var(--sky-deep)}
  .seg input:checked + span{background:var(--sky-deep);color:var(--paper)}
  .seg input:focus-visible + span{outline:2px solid var(--dot);outline-offset:-2px}
  .ico{height:12px;width:auto}

  input[type=range]{width:100%;accent-color:var(--sky-deep)}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sw{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);padding:0;
    box-shadow:0 0 0 1px var(--line);
  }
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--sky-dark)}
  input[type=color]{width:30px;height:30px;border:1px solid var(--line);border-radius:4px;padding:1px;background:var(--paper)}
  textarea, select{
    width:100%;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--paper);
  }
  textarea{resize:vertical;min-height:62px}
  .span2{grid-column:1 / -1}

  .locked{
    display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:#fff6ec;border:1px solid #ffd3a8;color:#a85a17;
    border-radius:4px;padding:8px 10px;font-size:12px;font-weight:700;margin-bottom:12px;
  }
  .text-off .locked{display:flex}
  .text-off .grid{opacity:.4;pointer-events:none}

  .btn{
    border:1px solid var(--sky-deep);background:var(--paper);color:var(--sky-dark);
    border-radius:4px;padding:5px 10px;font-weight:700;font-size:12px;
    box-shadow:0 2px 0 var(--sky-mid);
  }
  .btn:active{transform:translateY(2px);box-shadow:none}

  /* ---------- 오른쪽 탭 ---------- */
  .tabs{
    position:absolute;left:100%;top:26px;margin-left:14px;
    display:flex;flex-direction:column;gap:6px;
  }
  .tab{
    border:0;width:66px;padding:12px 6px;text-align:center;
    background:var(--sky-deep);color:var(--paper);
    font-family:var(--pixel);font-size:14px;
    border-radius:0 8px 8px 0;
    box-shadow:inset 3px 0 0 var(--sky-dark), 2px 2px 0 var(--sky-dark);
    transition:transform .12s;
  }
  .tab:hover{transform:translateX(2px)}
  .tab[aria-expanded=true]{
    background:var(--paper);color:var(--sky-dark);
    box-shadow:inset 3px 0 0 var(--dot), 2px 2px 0 var(--sky-dark);
  }
  .tab.save{background:var(--sky-dark);box-shadow:inset 3px 0 0 var(--dot), 2px 2px 0 #1f5f8a}
  .tab:disabled{opacity:.5;cursor:not-allowed;transform:none}

  footer{text-align:center;font-family:var(--pixel);font-size:11px;color:var(--sky-dark);padding:0 16px 28px}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%, 20px);opacity:0;
    background:var(--paper);border:1px solid var(--sky-deep);color:var(--sky-dark);
    padding:8px 14px;border-radius:4px;font-weight:700;font-size:12px;
    box-shadow:0 3px 0 var(--sky-mid);pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:50;max-width:90vw;text-align:center;word-break:break-all;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width: 640px){
    .top h1{font-size:22px}
    .frame{margin-right:0;margin-top:42px;padding:10px}
    .tabs{left:auto;right:14px;top:auto;bottom:100%;margin:0;flex-direction:row;gap:4px}
    .tab{width:64px;padding:8px 4px;font-size:13px;border-radius:8px 8px 0 0;
      box-shadow:inset 0 -3px 0 var(--sky-dark)}
    .tab:hover{transform:none}
    .tab[aria-expanded=true]{box-shadow:inset 0 -3px 0 var(--dot)}
    .tab.save{box-shadow:inset 0 -3px 0 var(--dot)}
    .page{padding:10px}
    .stage{height:clamp(240px, 50vh, 420px)}
    .grid{grid-template-columns:1fr}
    .guide{font-size:13px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<header class="top">
  <h1>하늘빛 사진첩</h1>
  <span>사진 4장으로 만드는 한 장</span>
</header>

<div class="wrap">
  <main class="frame">
    <nav class="tabs" aria-label="편집 메뉴">
      <button class="tab" data-acc="layout" aria-expanded="false" aria-controls="acc-layout">배치</button>
      <button class="tab" data-acc="text" aria-expanded="false" aria-controls="acc-text">글자</button>
      <button class="tab save" id="saveBtn">저장</button>
    </nav>

    <div class="page">
      <!-- 메인 사진 보이는 곳 -->
      <div class="stage" id="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas" aria-label="콜라주 편집 화면. + 칸을 누르면 사진 추가"></canvas>
        </div>
        <input type="file" id="fileInput" class="sr-only" accept="image/*" multiple tabindex="-1">
      </div>

      <!-- 설명글 -->
      <ol class="guide">
        <li>사진 위에서 스크롤 하면 확대/축소 돼요</li>
        <li>사진을 드래그하면 위치를 옮길 수 있어요</li>
        <li>+ 칸을 누르면 사진을 넣을 수 있어요 (최대 4장)</li>
      </ol>

      <!-- 배치 아코디언 -->
      <section class="acc" id="acc-layout" aria-label="배치 설정">
        <div class="acc-body">
          <div class="acc-inner">
            <h2 class="acc-title">배치</h2>
            <div class="grid">
              <div class="field">
                <span class="field-label">방향</span>
                <div class="seg" role="radiogroup" aria-label="방향">
                  <label><input type="radio" name="layout" value="horizontal" checked><span>
                    <svg class="ico" viewBox="0 0 26 12" aria-hidden="true"><rect x="0" y="0" width="7" height="12" fill="currentColor"/><rect x="9.5" y="0" width="7" height="12" fill="currentColor"/><rect x="19" y="0" width="7" height="12" fill="currentColor"/></svg>가로</span></label>
                  <label><input type="radio" name="layout" value="vertical"><span>
                    <svg class="ico" viewBox="0 0 26 12" aria-hidden="true"><rect x="6" y="0" width="14" height="3" fill="currentColor"/><rect x="6" y="4.5" width="14" height="3" fill="currentColor"/><rect x="6" y="9" width="14" height="3" fill="currentColor"/></svg>세로</span></label>
                </div>
              </div>
              <div class="field">
                <span class="field-label">칸 모양</span>
                <div class="seg" role="radiogroup" aria-label="칸 모양">
                  <label><input type="radio" name="ratio" value="1:1" checked><span>1:1</span></label>
                  <label><input type="radio" name="ratio" value="4:5"><span>4:5</span></label>
                  <label><input type="radio" name="ratio" value="16:9"><span>16:9</span></label>
                </div>
              </div>
              <div class="field">
                <label for="gap">여백 <span class="val" id="gapVal">16px</span></label>
                <input type="range" id="gap" min="0" max="80" value="16">
              </div>
              <div class="field">
                <span class="field-label">여백 색</span>
                <div class="swatches" id="bgSwatches">
                  <button class="sw" data-color="#ffffff" style="background:#ffffff" aria-label="흰색" aria-pressed="true"></button>
                  <button class="sw" data-color="#dff1fc" style="background:#dff1fc" aria-label="연한 하늘색" aria-pressed="false"></button>
                  <button class="sw" data-color="#5bb5e6" style="background:#5bb5e6" aria-label="하늘색" aria-pressed="false"></button>
                  <button class="sw" data-color="#2f7fb5" style="background:#2f7fb5" aria-label="진한 파랑" aria-pressed="false"></button>
                  <button class="sw" data-color="#222a30" style="background:#222a30" aria-label="검정" aria-pressed="false"></button>
                  <input type="color" id="bgCustom" value="#ffffff" aria-label="여백 색 직접 고르기">
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 글자 아코디언 -->
      <section class="acc" id="acc-text" aria-label="글자 설정">
        <div class="acc-body">
          <div class="acc-inner" id="textInner">
            <h2 class="acc-title">글자 · 자막</h2>
            <div class="locked">
              <span>글자는 가로 방향에서만 넣을 수 있어요.</span>
              <button class="btn" id="toHorizontal">가로로 바꾸기</button>
            </div>
            <div class="grid">
              <div class="field span2">
                <label for="txtInput">글자 내용 <span class="val">사진 하단 가운데에 자막처럼 들어가요</span></label>
                <textarea id="txtInput" placeholder="예) 2026년 가을, 바다 앞에서"></textarea>
              </div>
              <div class="field">
                <label for="txtFont">글씨체</label>
                <select id="txtFont">
                  <option value="nanum">나눔고딕 (깔끔)</option>
                  <option value="jua">주아 (동글동글)</option>
                  <option value="gaegu">개구 (손글씨)</option>
                  <option value="galmuri">갈무리 (픽셀)</option>
                </select>
              </div>
              <div class="field">
                <label for="txtSize">크기 <span class="val" id="sizeVal">48</span></label>
                <input type="range" id="txtSize" min="20" max="120" value="48">
              </div>
              <div class="field span2">
                <span class="field-label">글자 색</span>
                <div class="swatches" id="txtSwatches">
                  <button class="sw" data-color="#ffffff" style="background:#ffffff" aria-label="흰색" aria-pressed="true"></button>
                  <button class="sw" data-color="#fff27a" style="background:#fff27a" aria-label="노랑" aria-pressed="false"></button>
                  <button class="sw" data-color="#9fd4f3" style="background:#9fd4f3" aria-label="하늘색" aria-pressed="false"></button>
                  <button class="sw" data-color="#2f7fb5" style="background:#2f7fb5" aria-label="파랑" aria-pressed="false"></button>
                  <button class="sw" data-color="#222a30" style="background:#222a30" aria-label="검정" aria-pressed="false"></button>
                  <input type="color" id="txtColor" value="#ffffff" aria-label="글자 색 직접 고르기">
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<footer>사진은 서버로 올라가지 않고 내 기기 안에서만 처리돼요</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];

  const MAX_PHOTOS = 4;
  const CELL = { '1:1': [800, 800], '4:5': [800, 1000], '16:9': [800, 450] };
  const FONTS = {
    nanum: '"Nanum Gothic", sans-serif',
    jua: '"Jua", sans-serif',
    gaegu: '"Gaegu", cursive',
    galmuri: '"Galmuri11", monospace'
  };

  const state = {
    photos: [],                 // {img, zoom, ox, oy}
    layout: 'horizontal',
    ratio: '1:1',
    gap: 16,
    bg: '#ffffff',
    caption: { text: '', font: 'nanum', size: 48, color: '#ffffff' }
  };

  const canvas = $('#canvas');
  const ctx = canvas.getContext('2d');
  const stage = $('#stage');
  const wrap = $('#canvasWrap');
  const fileInput = $('#fileInput');
  let L = null;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function randomName() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    const arr = new Uint8Array(10);
    crypto.getRandomValues(arr);
    return 'collage_' + [...arr].map((v) => chars[v % chars.length]).join('') + '.png';
  }

  /* ---------- 아코디언 탭 ---------- */
  $$('.tab[data-acc]').forEach((tab) => tab.addEventListener('click', () => {
    const name = tab.dataset.acc;
    const willOpen = tab.getAttribute('aria-expanded') !== 'true';
    $$('.tab[data-acc]').forEach((t) => {
      const open = willOpen && t.dataset.acc === name;
      t.setAttribute('aria-expanded', String(open));
      $('#acc-' + t.dataset.acc).classList.toggle('open', open);
    });
    if (willOpen) {
      setTimeout(() => $('#acc-' + name).scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 260);
    }
  }));

  /* ---------- 사진 불러오기 ---------- */
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  async function addFiles(list) {
    const files = [...list].filter((f) => !f.type || f.type.startsWith('image/'));
    if (!files.length) return;
    const room = MAX_PHOTOS - state.photos.length;
    if (room <= 0) { toast('사진은 최대 4장까지 넣을 수 있어요. ✕로 한 장을 빼고 다시 넣어주세요.'); return; }
    if (files.length > room) toast(`최대 4장이라 앞의 ${room}장만 넣었어요.`);
    let failed = 0;
    for (const f of files.slice(0, room)) {
      try { state.photos.push({ img: await loadImage(f), zoom: 1, ox: 0, oy: 0 }); }
      catch { failed++; }
    }
    if (failed) toast(`${failed}장은 열 수 없는 형식이에요. JPG나 PNG로 바꿔서 넣어주세요.`);
    refresh();
  }

  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('over'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('over'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('over');
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });

  /* ---------- 배치 ---------- */
  $$('input[name=layout]').forEach((r) => r.addEventListener('change', () => {
    state.layout = r.value;
    updateTextLock();
    refresh();
  }));
  $$('input[name=ratio]').forEach((r) => r.addEventListener('change', () => {
    state.ratio = r.value;
    state.photos.forEach((p) => { p.ox = 0; p.oy = 0; });
    refresh();
  }));
  $('#gap').addEventListener('input', (e) => {
    state.gap = +e.target.value;
    $('#gapVal').textContent = state.gap + 'px';
    refresh();
  });

  function bindSwatches(groupSel, customSel, onPick) {
    const btns = $$(groupSel + ' .sw');
    const mark = (c) => btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === c)));
    btns.forEach((b) => b.addEventListener('click', () => {
      mark(b.dataset.color);
      $(customSel).value = b.dataset.color;
      onPick(b.dataset.color);
    }));
    $(customSel).addEventListener('input', (e) => { mark(null); onPick(e.target.value); });
  }
  bindSwatches('#bgSwatches', '#bgCustom', (c) => { state.bg = c; render(); });

  /* ---------- 글자 (자막) ---------- */
  const cap = state.caption;
  $('#txtInput').addEventListener('input', (e) => { cap.text = e.target.value; render(); });
  $('#txtFont').addEventListener('change', (e) => { cap.font = e.target.value; loadFont().then(render); render(); });
  $('#txtSize').addEventListener('input', (e) => { cap.size = +e.target.value; $('#sizeVal').textContent = cap.size; render(); });
  bindSwatches('#txtSwatches', '#txtColor', (c) => { cap.color = c; render(); });

  function loadFont() {
    if (!document.fonts?.load) return Promise.resolve();
    return document.fonts.load(`40px ${FONTS[cap.font]}`, cap.text || '가A').catch(() => {});
  }

  function updateTextLock() {
    const off = state.layout !== 'horizontal';
    $('#textInner').classList.toggle('text-off', off);
    $$('#textInner .grid textarea, #textInner .grid select, #textInner .grid input, #textInner .grid button')
      .forEach((el) => { el.disabled = off; });
  }
  $('#toHorizontal').addEventListener('click', () => {
    $('input[name=layout][value=horizontal]').checked = true;
    state.layout = 'horizontal';
    updateTextLock();
    refresh();
  });

  /* ---------- 레이아웃 계산 ---------- */
  // withGhost: 미리보기에서만 '+ 사진' 칸을 하나 더 붙임 (저장 이미지엔 없음)
  function getLayout(withGhost) {
    const n = state.photos.length;
    const slots = Math.max(1, n + (withGhost && n < MAX_PHOTOS ? 1 : 0));
    const [cw, ch] = CELL[state.ratio];
    const g = state.gap;
    const horiz = state.layout === 'horizontal';
    const W = horiz ? slots * cw + (slots + 1) * g : cw + 2 * g;
    const H = horiz ? ch + 2 * g : slots * ch + (slots + 1) * g;
    const cells = [];
    for (let i = 0; i < slots; i++) {
      cells.push({ x: horiz ? g + i * (cw + g) : g, y: horiz ? g : g + i * (ch + g), w: cw, h: ch });
    }
    const photoW = horiz && n ? n * cw + (n + 1) * g : W;
    return { W, H, cells, cw, ch, g, horiz, photoW };
  }

  /* ---------- 그리기 ---------- */
  function draw(c, lay, exporting) {
    c.fillStyle = state.bg;
    c.fillRect(0, 0, lay.W, lay.H);

    lay.cells.forEach((cell, i) => {
      const p = state.photos[i];
      c.save();
      c.beginPath();
      c.rect(cell.x, cell.y, cell.w, cell.h);
      c.clip();
      if (p) {
        const s = Math.max(cell.w / p.img.width, cell.h / p.img.height) * p.zoom;
        const w = p.img.width * s, h = p.img.height * s;
        c.drawImage(p.img, cell.x + cell.w / 2 - w / 2 + p.ox, cell.y + cell.h / 2 - h / 2 + p.oy, w, h);
      } else if (!exporting) {
        drawGhost(c, cell);
      }
      c.restore();
    });

    if (lay.horiz && state.photos.length && cap.text.trim()) drawCaption(c, lay);
  }

  function drawGhost(c, cell) {
    c.fillStyle = '#f1f9fe';
    c.fillRect(cell.x, cell.y, cell.w, cell.h);
    c.setLineDash([18, 12]);
    c.lineWidth = 5;
    c.strokeStyle = '#9fd4f3';
    c.strokeRect(cell.x + 20, cell.y + 20, cell.w - 40, cell.h - 40);
    c.setLineDash([]);
    const cx = cell.x + cell.w / 2, cy = cell.y + cell.h / 2;
    const small = cell.h < 600;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = '#2f7fb5';
    c.font = `${small ? 120 : 160}px "Jua", sans-serif`;
    c.fillText('+', cx, cy - (small ? 40 : 60));
    c.font = `${small ? 44 : 56}px "Jua", sans-serif`;
    c.fillText('사진 넣기', cx, cy + (small ? 50 : 60));
    c.font = `28px "Nanum Gothic", sans-serif`;
    c.fillStyle = '#6b8599';
    c.fillText(`${state.photos.length} / ${MAX_PHOTOS}장`, cx, cy + (small ? 100 : 124));
  }

  function wrapLines(c, text, maxW) {
    const out = [];
    text.split('\n').forEach((para) => {
      let line = '';
      const tokens = para.split(/(\s+)/);
      tokens.forEach((tok) => {
        if (c.measureText(line + tok).width <= maxW) { line += tok; return; }
        if (line.trim()) out.push(line.trim());
        line = '';
        // 한 덩어리가 너무 길면 글자 단위로 자르기
        for (const ch of tok.trimStart()) {
          if (c.measureText(line + ch).width > maxW && line) { out.push(line); line = ''; }
          line += ch;
        }
      });
      out.push(line.trim());
    });
    return out;
  }

  function isLight(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 140;
  }

  function drawCaption(c, lay) {
    const size = cap.size * (lay.ch / 800);
    const lh = size * 1.3;
    c.save();
    c.font = `700 ${size}px ${FONTS[cap.font]}`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    const maxW = lay.photoW - lay.g * 2 - size;
    const lines = wrapLines(c, cap.text, maxW);
    const cx = lay.photoW / 2;
    const bottom = lay.g + lay.ch - lay.ch * 0.06 - size * 0.5;
    const light = isLight(cap.color);
    c.lineJoin = 'round';
    c.lineWidth = Math.max(3, size * 0.16);
    c.strokeStyle = light ? 'rgba(10,20,30,.85)' : 'rgba(255,255,255,.95)';
    c.shadowColor = light ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.4)';
    c.shadowBlur = size * 0.2;
    lines.forEach((l, i) => {
      const y = bottom - (lines.length - 1 - i) * lh;
      c.strokeText(l, cx, y);
    });
    c.shadowBlur = 0;
    c.fillStyle = cap.color;
    lines.forEach((l, i) => {
      const y = bottom - (lines.length - 1 - i) * lh;
      c.fillText(l, cx, y);
    });
    c.restore();
  }

  function render() {
    L = getLayout(true);
    if (canvas.width !== L.W || canvas.height !== L.H) {
      canvas.width = L.W;
      canvas.height = L.H;
    }
    draw(ctx, L, false);
    fit();
  }

  function fit() {
    if (!L) return;
    const aw = stage.clientWidth - 32;
    const ah = stage.clientHeight - 32;
    const s = Math.min(aw / L.W, ah / L.H);
    wrap.style.width = Math.max(1, L.W * s) + 'px';
    wrap.style.height = Math.max(1, L.H * s) + 'px';
  }
  new ResizeObserver(fit).observe(stage);

  function renderRemoveButtons() {
    $$('.cell-x').forEach((b) => b.remove());
    state.photos.forEach((p, i) => {
      const cell = L.cells[i];
      const b = document.createElement('button');
      b.className = 'cell-x';
      b.textContent = '✕';
      b.setAttribute('aria-label', `${i + 1}번째 사진 빼기`);
      b.style.left = ((cell.x + cell.w) / L.W * 100) + '%';
      b.style.top = (cell.y / L.H * 100) + '%';
      b.addEventListener('click', () => { state.photos.splice(i, 1); refresh(); });
      wrap.appendChild(b);
    });
  }

  function refresh() {
    render();
    renderRemoveButtons();
    $('#saveBtn').disabled = !state.photos.length;
  }

  /* ---------- 캔버스 조작 ---------- */
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }
  function hitCell(p) {
    return L.cells.findIndex((c) => p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h);
  }
  function zoomCell(ci, point, newZoom, from) {
    const photo = state.photos[ci];
    const cell = L.cells[ci];
    const src = from || photo;
    const nz = clamp(newZoom, 0.2, 8);
    const k = nz / src.zoom;
    const px = point.x - (cell.x + cell.w / 2);
    const py = point.y - (cell.y + cell.h / 2);
    photo.ox = px - (px - src.ox) * k;
    photo.oy = py - (py - src.oy) * k;
    photo.zoom = nz;
  }

  canvas.addEventListener('wheel', (e) => {
    const p = toCanvas(e);
    const ci = hitCell(p);
    const photo = state.photos[ci];
    if (!photo) return;
    e.preventDefault();
    zoomCell(ci, p, photo.zoom * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)));
    render();
  }, { passive: false });

  canvas.addEventListener('dblclick', (e) => {
    const photo = state.photos[hitCell(toCanvas(e))];
    if (photo) { Object.assign(photo, { zoom: 1, ox: 0, oy: 0 }); render(); }
  });

  const pointers = new Map();
  let gesture = null;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (pointers.size === 1) {
      gesture = { type: 'pan', ci: hitCell(p), last: p, start: p, moved: false };
    } else if (pointers.size === 2 && gesture?.type === 'pan') {
      const photo = state.photos[gesture.ci];
      if (photo) {
        const [a, b] = [...pointers.values()];
        gesture = { type: 'pinch', ci: gesture.ci, d0: dist(a, b), m0: mid(a, b), from: { zoom: photo.zoom, ox: photo.ox, oy: photo.oy } };
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse' && L) {
        const ci = hitCell(toCanvas(e));
        canvas.style.cursor = state.photos[ci] ? 'grab' : ci >= 0 ? 'pointer' : 'default';
      }
      return;
    }
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (!gesture) return;

    if (gesture.type === 'pan') {
      if (dist(p, gesture.start) > 6) gesture.moved = true;
      const photo = state.photos[gesture.ci];
      if (photo) {
        canvas.style.cursor = 'grabbing';
        photo.ox += p.x - gesture.last.x;
        photo.oy += p.y - gesture.last.y;
        render();
      }
      gesture.last = p;
    } else if (gesture.type === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const m = mid(a, b);
      const g = gesture;
      zoomCell(g.ci, g.m0, g.from.zoom * (dist(a, b) / g.d0), g.from);
      const photo = state.photos[g.ci];
      photo.ox += m.x - g.m0.x;
      photo.oy += m.y - g.m0.y;
      render();
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    // 빈 '+' 칸을 탭/클릭하면 사진 고르기
    if (e.type === 'pointerup' && gesture?.type === 'pan' && !gesture.moved && pointers.size === 0) {
      if (gesture.ci >= state.photos.length && gesture.ci >= 0) fileInput.click();
    }
    if (pointers.size === 0) {
      gesture = null;
      canvas.style.cursor = '';
    } else if (gesture?.type === 'pinch') {
      const rest = [...pointers.values()][0];
      gesture = { type: 'pan', ci: gesture.ci, last: rest, start: rest, moved: true };
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  /* ---------- 저장 ---------- */
  $('#saveBtn').addEventListener('click', async () => {
    if (!state.photos.length) { toast('먼저 사진을 한 장 이상 넣어주세요.'); return; }
    if (document.fonts?.ready) await document.fonts.ready;
    const lay = getLayout(false);
    const out = document.createElement('canvas');
    out.width = lay.W;
    out.height = lay.H;
    draw(out.getContext('2d'), lay, true);
    out.toBlob((blob) => {
      if (!blob) { toast('이미지가 너무 커서 저장하지 못했어요. 사진 수나 여백을 줄여보세요.'); return; }
      const name = randomName();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast(`${name} 저장했어요`);
    }, 'image/png');
  });

  /* ---------- 시작 ---------- */
  updateTextLock();
  refresh();
  if (document.fonts?.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
